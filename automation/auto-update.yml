# Daily news refresh — to enable, move this file to .github/workflows/auto-update.yml
# (GitHub → Add file → Create new file → name it .github/workflows/auto-update.yml → paste this).
# Every run commits build/data/news.json; GitHub Pages then rebuilds the site, which also
# refreshes the "Reviewed <month>" dates and the sitemap.
name: Daily news refresh

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh headline feed
        run: python build/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "ic-autoupdate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/data/news.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update: daily news feed"
          git push
